<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d7a3e">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>TruSpace Facilities</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1d7a3e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TruSpace">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: operations console — fixed left rail of modules, a working canvas, and a slide-in record drawer. Signature: the rent-roll month grid. */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --sunk:#e9eee8; --ink:#16211a; --muted:#5a6a60; --line:#d5ddd4;
  --accent:#1d7a3e; --accent-ink:#ffffff; --sun:#d9a514;
  --ok:#1d7a3e; --warn:#a86b0c; --bad:#c03d12; --info:#2a5f9e; --idle:#8a978e;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:8px; --shadow:0 1px 2px rgb(20 40 25 / .06),0 8px 24px rgb(20 40 25 / .07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1411; --surface:#151d18; --sunk:#1b251f; --ink:#e4ebe6; --muted:#97a69c; --line:#28342d;
  --accent:#4cb672; --accent-ink:#04110a; --sun:#f0c540;
  --ok:#4cb672; --warn:#e2a74a; --bad:#f17d50; --info:#71a8ea; --idle:#6f7c74;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 10px 30px rgb(0 0 0 / .35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1411; --surface:#151d18; --sunk:#1b251f; --ink:#e4ebe6; --muted:#97a69c; --line:#28342d;
  --accent:#4cb672; --accent-ink:#04110a; --sun:#f0c540;
  --ok:#4cb672; --warn:#e2a74a; --bad:#f17d50; --info:#71a8ea; --idle:#6f7c74;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 10px 30px rgb(0 0 0 / .35); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.65rem;line-height:1.15}
h2{font-size:1.15rem}
h3{font-size:.98rem}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.drawer .dbody{grid-template-columns:minmax(0,1fr)}
.rail{background:var(--surface);border-right:1px solid var(--line);padding-block:18px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.mark{width:34px;height:34px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font:700 18px var(--f-display);position:relative}
.mark::after{content:"";position:absolute;right:-3px;bottom:-3px;width:11px;height:11px;border-radius:3px;background:var(--sun)}
.brand b{font:700 17px var(--f-display);display:block;line-height:1}
.brand span{font-size:11px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:6px;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button[aria-current="page"]{background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--ink)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.badge{font:500 11px var(--f-mono);background:var(--sunk);color:var(--ink);border-radius:10px;padding:1px 7px}
.badge.hot{background:var(--bad);color:#fff}
.rolebox{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:grid;gap:6px}
.rolebox select{width:100%}

.main{min-width:0;padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.wrap>*,.dbody>*{min-width:0}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.pagehead p{margin:4px 0 0;color:var(--muted);max-width:68ch}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.banner{border:1px dashed var(--warn);background:color-mix(in srgb,var(--warn) 9%,transparent);padding:10px 14px;border-radius:var(--r);font-size:13px}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:6px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel>header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel .body{padding:14px 16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:grid;gap:4px;align-content:start}
.kpi .v{font:600 1.45rem var(--f-display);font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.alert .v{color:var(--bad)}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.code{font:500 12px var(--f-mono);color:var(--muted)}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap;border:1px solid currentColor;line-height:1.5}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.c-warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 11%,transparent)}
.c-bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.c-info{color:var(--info);background:color-mix(in srgb,var(--info) 10%,transparent)}
.c-idle{color:var(--idle);background:transparent}

/* Rent roll grid */
.roll{display:grid;gap:0;font-size:13px}
.roll .row{display:grid;grid-template-columns:minmax(180px,1.4fr) repeat(var(--m),minmax(54px,1fr)) minmax(96px,.8fr);align-items:center;border-bottom:1px solid var(--line)}
.roll .row:last-child{border-bottom:0}
.roll .row>div{padding:8px 6px}
.roll .head{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.cell{height:26px;border-radius:4px;display:grid;place-items:center;font:500 10.5px var(--f-mono);cursor:pointer;border:0;width:100%}
.cell.paid{background:color-mix(in srgb,var(--ok) 78%,transparent);color:#fff}
.cell.process{background:color-mix(in srgb,var(--info) 22%,transparent);color:var(--info);border:1px solid color-mix(in srgb,var(--info) 50%,transparent)}
.cell.late{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad);border:1px solid var(--bad)}
.cell.missing{background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--bad) 22%,transparent) 0 4px,transparent 4px 8px);color:var(--bad);border:1px dashed var(--bad)}
.cell.upcoming{background:var(--sunk);color:var(--muted);cursor:default}
.cell.na{background:transparent;cursor:default}
.cell.free{background:transparent;color:var(--muted);border:1px dotted var(--line);cursor:default}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.list{display:grid}
.li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.when{font:500 12px var(--f-mono);min-width:76px;color:var(--muted)}
.when.soon{color:var(--bad)}
.grow{flex:1;min-width:0}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0}
.pcard:hover{border-color:var(--muted)}
.pcard .ph{aspect-ratio:16/7;background:var(--sunk);max-width:100%;position:relative;display:grid;place-items:center;color:var(--muted)}
.pcard .ph img{width:100%;height:100%;object-fit:cover}
.pcard .ph .tag{position:absolute;left:10px;top:10px}
.pcard .pb{padding:12px 14px;display:grid;gap:6px}
.srows{display:grid;gap:0;border-top:1px solid var(--line);margin-top:4px}
.srow{display:grid;grid-template-columns:96px auto;gap:2px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow .sl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--muted);grid-row:span 2;align-self:start;padding-top:3px}
.srow .sn{grid-column:2;font-size:12px;color:var(--muted);line-height:1.35}
.srow .sn.w{color:var(--warn)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 20px}
.fact .l{font-size:11.5px;color:var(--muted)}
.fact .v{font-weight:500}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:9px 12px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent)}

.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=text],input[type=number],input[type=date],input[type=month],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;max-width:100%}
textarea{width:100%;min-height:78px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent);border-color:var(--accent)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.form .full{grid-column:1/-1}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{width:100%}
.hint{font-size:11.5px;color:var(--muted)}
.section-t{grid-column:1/-1;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.check{display:flex;gap:8px;align-items:center;font-size:13.5px}

.photos{display:flex;flex-wrap:wrap;gap:8px}
.photos img,.photos .ph0{width:84px;height:84px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--sunk);cursor:zoom-in}
.ph0{display:grid;place-items:center;font-size:11px;color:var(--muted);cursor:default}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.drop input{max-width:100%}
.file{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:4px 9px;font-size:12.5px;text-decoration:none;color:var(--ink)}

.timeline{display:grid;gap:0;border-left:2px solid var(--line);margin-left:6px}
.tl{position:relative;padding:0 0 14px 16px}
.tl::before{content:"";position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl .m{font-size:12px;color:var(--muted)}

.thread{display:grid;align-content:start;gap:10px;max-height:58vh;overflow:auto;padding:4px}
.msg{max-width:78%;padding:9px 12px;border-radius:10px;background:var(--sunk)}
.msg.me{justify-self:end;background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.msg .m{font-size:11.5px;color:var(--muted);margin-bottom:3px}
.msg.notice{border:1px solid var(--warn)}
.chatlayout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:0;min-height:480px}
.convs{border-right:1px solid var(--line);overflow:auto}
.conv{all:unset;display:block;cursor:pointer;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;box-sizing:border-box}
.conv[aria-current="true"]{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.conv:focus-visible{outline:2px solid var(--accent)}

.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;counter-reset:s}
.step{border-top:3px solid var(--line);padding-top:8px;font-size:12.5px;color:var(--muted)}
.step b{display:block;color:var(--ink);font-weight:600}
.step.done{border-color:var(--ok)}
.step.now{border-color:var(--sun)}

/* modal / drawer */
.scrim{position:fixed;inset:0;background:rgb(10 20 14 / .45);z-index:40;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(860px,100%);height:100%;overflow:auto;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer>header{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding-block:14px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:12px;z-index:2}
.drawer .dbody{padding-block:18px 30px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));display:grid;gap:18px}
.drawer footer{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 20px;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:auto}
.lightbox{position:fixed;inset:0;background:rgb(0 0 0 / .85);z-index:60;display:grid;place-items:center;padding:20px}
.lightbox img,.lightbox video{max-height:90vh;max-width:100%;border-radius:6px}
.lbx{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:50%;border:0;background:rgb(255 255 255 / .2);color:#fff;font-size:18px;cursor:pointer}
.vthumb{position:relative;display:inline-block;width:84px;height:84px;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:#000;cursor:pointer}
.vthumb video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.vthumb i{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-style:normal;font-size:22px;text-shadow:0 1px 4px rgb(0 0 0 / .6)}
.vthumb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.addph.vid{border-style:dotted}
@media (max-width:760px){.vthumb{width:88px;height:88px}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:80;font-size:13.5px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}


/* Ledger */
table.ledger td{padding:8px 12px}
table.ledger tr.yr td{background:var(--sunk)}
/* Rent schedule */
.sched{max-height:70vh;overflow:auto;border:1px solid var(--line);border-radius:var(--r)}
.sched table{font-size:12.5px}
.sched thead th{position:sticky;top:0;z-index:1}
.sched td{padding:6px 10px;border-bottom:1px solid var(--line)}
.sched tr.yr td{background:var(--sunk);border-bottom:2px solid var(--line)}
.sched tfoot td{position:sticky;bottom:0;background:var(--surface);border-top:2px solid var(--ink)}
.sched tr.escrow td{box-shadow:inset 0 2px 0 var(--sun)}
.sched tr.escrow td:first-child{font-weight:600}
.sched tr.nowrow td:first-child{border-left:3px solid var(--accent)}
.upfront{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:baseline;padding:10px 14px;border:1px dashed var(--line);border-radius:var(--r);margin:12px 0;font-size:13px}
.drawer .seg button{min-height:30px;padding:4px 10px}
/* Front view & signage */
.pcard .ph svg.facade{width:100%;height:100%;display:block}
.ptype{position:absolute;right:8px;bottom:8px;font-size:11px;font-weight:600;background:var(--surface);color:var(--ink);border-radius:999px;padding:2px 8px;border:1px solid var(--line)}
.pcard .ph img{position:absolute;inset:0}
.front{aspect-ratio:16/9;max-width:100%;border-radius:8px;overflow:hidden;background:var(--sunk);border:1px solid var(--line)}
.front img,.front svg{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.sthumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px}
table.space input{width:96px;text-align:right}
table.space input.needv{border-color:var(--bad)}
table.space tr.muted td{opacity:.55}
/* Scouting requirements */
.locbar{display:grid;grid-template-columns:minmax(260px,1.6fr) minmax(150px,.8fr) minmax(150px,.8fr) 2fr;gap:12px 16px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.locbar select{width:100%;min-height:40px}
.locstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.locstats>div{display:grid;border-left:3px solid var(--accent);padding-left:10px}
.locstats .v{font:600 1.25rem var(--f-display)}
.rcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px;align-content:start}
.rcard.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.rcard-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.rwhy{margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rcount{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;border-top:1px solid var(--line);padding-top:8px}
@media (max-width:1100px){.locbar{grid-template-columns:1fr 1fr}.locstats{grid-column:1/-1;grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.locbar{grid-template-columns:1fr}}
.eplan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px;background:var(--sunk);border-radius:8px;padding:12px 14px}
.eplan p{margin:4px 0 0;font-size:13px}
@media (max-width:760px){.eplan{grid-template-columns:1fr}}

<script>
/* ======================= utilities ======================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr = n => '₹' + Math.round(+n || 0).toLocaleString('en-IN');
const isoOf = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const TODAY = isoOf(new Date());
const CUR = TODAY.slice(0, 7);
function addMonths(s, m){ const d = new Date(s + 'T00:00:00'); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + m); const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(day, last)); return isoOf(d); }
function addDays(s, n){ const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return isoOf(d); }
function daysTo(s){ return Math.round((new Date(s + 'T00:00:00') - new Date(TODAY + 'T00:00:00')) / 864e5); }
const fmtD = s => s ? new Date(s.slice(0,10) + 'T00:00:00').toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'}) : '—';
const fmtDT = s => s ? new Date(s).toLocaleString('en-IN', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'}) : '';
function perAdd(p, n){ const [y, m] = p.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function perDiff(a, b){ const [y1, m1] = a.split('-').map(Number), [y2, m2] = b.split('-').map(Number); return (y2 - y1) * 12 + (m2 - m1); }
const perLabel = p => { if(!p) return '—'; const [y, m] = p.split('-'); return new Date(+y, +m - 1, 1).toLocaleDateString('en-IN', {month:'short', year:'2-digit'}); };
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function fy(s){ const [y, m] = s.split('-').map(Number); const st = m >= 4 ? y : y - 1; return String(st).slice(2) + '-' + String(st + 1).slice(2); }
const nowISO = () => new Date().toISOString();
function toast(t){ const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 3200); }
const by = (k, dir = 1) => (a, b) => (a[k] > b[k] ? 1 : a[k] < b[k] ? -1 : 0) * dir;

/* ======================= state ======================= */
const COLS = ['properties','owners','leases','invoices','tickets','messages','inspections','sites','reqs','partners','people'];
const S = Object.fromEntries(COLS.map(c => [c, []]));
const ALL = Object.fromEntries(COLS.map(c => [c, []]));
/* Each workspace sees its own premises: TrustLab sees TrustLab-leased premises; a franchise partner sees only the premises it manages in TruSpace; an owner sees theirs. */
function rescope(){
  const r = role();
  if(r.kind === 'owner'){ COLS.forEach(c => S[c] = ALL[c]); return; }
  const mine = p => r.kind === 'franchisee' ? (p.managedBy === 'franchise' && p.partnerId === r.partnerId) : p.managedBy !== 'franchise';
  S.properties = ALL.properties.filter(mine); const ids = new Set(S.properties.map(p => p.id));
  for(const c of ['leases','invoices','tickets','inspections','messages']) S[c] = ALL[c].filter(x => ids.has(x.propertyId));
  const own = new Set(S.properties.map(p => p.ownerId));
  S.owners = r.kind === 'franchisee' ? ALL.owners.filter(o => own.has(o.id) || o.partnerId === r.partnerId) : ALL.owners.filter(o => own.has(o.id) || (!ALL.properties.some(p => p.ownerId === o.id) && !o.partnerId));
  for(const c of ['sites','reqs','partners','people']) S[c] = ALL[c];
}
const tenantOf = P => P && P.managedBy === 'franchise' ? (S.partners.find(x => x.id === P.partnerId)?.name || 'Franchise partner') : 'TrustLab Diagnostics';
const UI = { route:'overview', sel:null, tab:'summary', filt:{}, conv:null, roleView:null };
let LIVE = false, DB = null, ASSETS = null, DL = null, USER = null;
const ME = { uid:null, canEdit:true, linked:null, resolved:false };

const TYPES = ['Laboratory','Collection centre','Hospital','Clinic','Polyclinic','Hospital lab (HLM)','Office','Warehouse / store','Staff accommodation'];
const SITE_PURPOSE = ['Laboratory','Collection centre','Hospital','Clinic','Polyclinic'];
const PSTAT = ['Pipeline','Under fit-out','Active','Notice served','Vacated'];
const INV_TYPES = ['Rent','Electricity','Maintenance','Water','Other'];
const TCAT = ['Electrical wiring','Plumbing','Civil / structural','Seepage / roofing','Doors, windows & locks','Painting','Flooring & tiles','Shutters & grills','Other'];
const PRI = {P1:{l:'P1 Critical', h:4}, P2:{l:'P2 High', h:24}, P3:{l:'P3 Normal', h:72}, P4:{l:'P4 Low', h:168}};
const TSTAT = ['Open','Assigned','In progress','Awaiting owner','Resolved','Closed'];


/* ======================= role & scope ======================= */
function role(){
  if (ME.linked && ME.linked.role === 'owner') return {kind:'owner', ownerId:ME.linked.ownerId};
  if (ME.linked && ME.linked.role === 'franchisee') return {kind:'franchisee', partnerId:ME.linked.partnerId};
  if (UI.roleView && UI.roleView.startsWith('fr:')) return {kind:'franchisee', partnerId:UI.roleView.slice(3), preview:true};
  if (UI.roleView && UI.roleView !== 'tdpl') return {kind:'owner', ownerId:UI.roleView, preview:true};
  if (ME.canEdit || (ME.linked && ME.linked.role === 'staff') || !LIVE) return {kind:'tdpl'};
  return {kind:'none'};
}
const isOwner = () => role().kind === 'owner';
const isFranchisee = () => role().kind === 'franchisee';
const NAV_FR = [['sites','My locations']];
const NAV_FR_FULL = [['sites','My locations'],['overview','Premises overview'],['properties','Premises'],['leases','Leases & contracts'],['inspections','Take-over & handover'],['invoices','Rent & invoices'],['ledgers','Owner ledgers'],['tickets','Repairs & tickets'],['messages','Owner messages'],['exits','Exits & terminations'],['owners','Owners']];
const frFull = r => r.kind === 'franchisee' && (partner(r.partnerId)?.premisesMgmt || ALL.properties.some(p => p.partnerId === r.partnerId));
function scopeProps(){ const r = role(); return r.kind === 'owner' ? S.properties.filter(p => p.ownerId === r.ownerId) : S.properties; }
function inScope(rec){ const ids = new Set(scopeProps().map(p => p.id)); return ids.has(rec.propertyId); }
const prop = id => S.properties.find(p => p.id === id);
const owner = id => S.owners.find(o => o.id === id);
const partner = id => S.partners.find(x => x.id === id);
const actor = () => { const r = role(); return r.kind === 'owner' ? (owner(r.ownerId)?.name || 'Owner') : r.kind === 'franchisee' ? (partner(r.partnerId)?.name || 'Franchise partner') + ' (franchise)' : 'TrustLab Facilities'; };
const side = () => isOwner() ? 'owner' : 'tdpl';

/* ======================= lease maths ======================= */
function leaseOf(pid){ return S.leases.filter(l => l.propertyId === pid).sort(by('start', -1))[0]; }
const rentStartOf = L => addDays(L.start, +L.fitout || 0);
const escAnchor = L => L.escFrom === 'Rent commencement' ? rentStartOf(L) : L.start;
function escSteps(L, dateStr){ if(!L.escEvery || !L.escPct) return 0; const a = escAnchor(L); let n = 0; while(n < 200 && addMonths(a, L.escEvery * (n + 1)) <= dateStr) n++; return n; }
function escAmt(L, base, dateStr){ const n = escSteps(L, dateStr); base = +base || 0; return Math.round(L.escType === 'Simple' ? base * (1 + n * (L.escPct || 0) / 100) : base * Math.pow(1 + (L.escPct || 0) / 100, n)); }
function rentFor(L, period){ if(!L) return 0; const d = period + '-01'; return escAmt(L, L.rent, d < L.start ? L.start : d); }
function nextEsc(L){ if(!L.escEvery || !L.escPct) return null; const a = escAnchor(L); let n = 1; while(n < 200 && addMonths(a, L.escEvery * n) <= TODAY) n++; const d = addMonths(a, L.escEvery * n); return d <= L.end ? d : null; }
const dayCount = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 864e5) + 1;
const SCHED = new Map();
/* Month-by-month rent for the whole term: pro-rata first/last month, rent-free period, escalation, advance-rent adjustment, maintenance, GST/RCM, TDS and due dates (advance or arrears). */
function schedule(L){
  const end = L.exit?.effective && L.exit.effective < L.end ? L.exit.effective : L.end;

    if(LIVE && ASSETS){
      try { const r = await ASSETS.upload(f); out.push({id:r.id, url:r.url, name:f.name, type:f.type}); }
      catch(e){ toast(`${f.name}: ` + (e?.code === 'too_large' ? 'file is over 20 MB' : e?.code === 'unsupported_type' ? 'file type not supported' : 'upload failed')); }
    } else {
      if(f.size > ((f.type || '').startsWith('video') ? 25e6 : 4e6)){ toast(`${f.name} is too large for preview mode`); continue; }
      const url = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(f); });

function rollGrid(leases, months = 7){

function criticalDates(days, pid){
  const ev = [];
  for(const L of S.leases){ if(pid && L.propertyId !== pid) continue; if(!inScope(L)) continue; const st = leaseState(L); if(['Terminated','Draft'].includes(st)) continue; const P = prop(L.propertyId);
    ev.push({d:L.end, t:'Lease expiry', p:P}); ev.push({d:noticeBy(L), t:`Last date to serve renewal/exit notice (${L.notice} mo)`, p:P});
    const le = lockEnd(L); if(le) ev.push({d:le, t:'Lock-in ends', p:P});
    const ne = nextEsc(L); if(ne) ev.push({d:ne, t:`Rent escalates ${L.escPct}% → ${inr(rentFor(L, ne.slice(0,7)))}`, p:P});
    if(L.exit?.effective && L.exit.stage < 5) ev.push({d:L.exit.effective, t:'Exit effective — handover due', p:P});
  }
  const list = ev.filter(e => e.d && daysTo(e.d) <= days && daysTo(e.d) >= -30).sort(by('d'));
  if(!list.length) return `<div class="empty">Nothing due in the next ${days} days.</div>`;
  return `<div class="list">${list.map(e => { const dd = daysTo(e.d); return `<div class="li"><span class="when ${dd <= 30 ? 'soon' : ''}">${dd < 0 ? Math.abs(dd) + 'd ago' : dd === 0 ? 'today' : 'in ' + dd + 'd'}</span><div class="grow"><div>${esc(e.t)}</div><div class="small muted">${pid ? '' : esc(e.p?.name || '') + ' · '}${fmtD(e.d)}</div></div></div>`; }).join('')}</div>`;
}
function attention(){
  const items = [];
  S.invoices.filter(i => invState(i) === 'Overdue').forEach(i => items.push({k:'bad', t:`${i.type} invoice ${i.number} overdue`, s:`${prop(i.propertyId)?.name} · ${inr(i.net)} · due ${fmtD(i.dueDate)}`, a:`data-act="openInv" data-id="${i.id}"`}));
  S.leases.forEach(L => { if(['Draft','Terminated'].includes(leaseState(L))) return; for(let k = -2; k <= 0; k++){ const p = perAdd(CUR, k); if(rentCell(L, p).k === 'missing') items.push({k:'bad', t:`Rent for ${perLabel(p)} not invoiced`, s:`${prop(L.propertyId)?.name} · ${inr((schedRow(L, p)?.rent || 0) - (schedRow(L, p)?.adj || 0))} · ask owner or record on their behalf`, a:`data-act="newInvoice" data-lease="${L.id}" data-period="${p}"`}); } });
  S.tickets.filter(slaBreached).forEach(t => items.push({k:'warn', t:`${t.no} past SLA — ${t.title}`, s:`${prop(t.propertyId)?.name} · ${PRI[t.priority].l} · ${t.status}`, a:`data-act="openTicket" data-id="${t.id}"`}));
  inspAttention(items);

  S.messages.filter(m => m.from === 'owner' && !(m.read || {}).tdpl).forEach(m => items.push({k:'info', t:`Unread message from ${m.by}`, s:m.text.slice(0, 90), a:`data-act="openConv" data-id="${m.propertyId}"`}));
  S.leases.filter(L => leaseState(L) === 'Draft').forEach(L => items.push({k:'idle', t:`Draft lease ${L.ref} awaiting signature`, s:`${prop(L.propertyId)?.name} · from ${fmtD(L.start)}`, a:`data-act="openLease" data-id="${L.id}"`}));

}

/* Three independent statuses per property: occupancy, rent, repairs */
function occStatus(P){

  if(P.status === 'Pipeline') return {v:'Pipeline', k:'info', note: L ? `Lease ${ls.toLowerCase()} · possession ${fmtD(L.start)}` : 'No lease yet'};
  if(P.status === 'Under fit-out') return {v:'Fit-out', k:'info', note: L ? 'Rent from ' + fmtD(rentStartOf(L)) : ''};
  const note = !L ? 'No lease recorded' : ls === 'Notice period' ? `Notice served · vacating ${fmtD(L.exit.effective)}` : ls === 'Renewal due' ? `Lease ends ${fmtD(L.end)} · renewal due` : ls === 'Expired' ? `Lease expired ${fmtD(L.end)}` : `Lease to ${fmtD(L.end)}`;

}
function rentStatus(P){

  const sc = schedule(L); let od = 0, odN = 0, nextDue = null;
  const first = S.invoices.filter(i => i.leaseId === L.id && i.type === 'Rent').map(i => i.period).sort()[0] || L.start.slice(0, 7);
  for(const r of sc.rows){ if(r.p > perAdd(CUR, 1)) break; if(r.p < first) continue; const c = rentCell(L, r.p); const amt = c.inv ? c.inv.net : r.net - r.maint - (r.gst - Math.round((r.rent - r.adj) * (L.gstMode === 'Forward' ? 0.18 : 0)));
    if(['late','missing'].includes(c.k)){ od += c.inv ? c.inv.net : (r.rent - r.adj) + (L.gstMode === 'Forward' ? Math.round((r.rent - r.adj) * 0.18) : 0) - (r.tds || 0); odN++; }

}

const LED_TABS = [['Rent','Rent'],['Electricity','Electricity'],['Maintenance','Maintenance'],['Other','Other payments']];

function fyStart(f){ return '20' + f.slice(0, 2) + '-04-01'; }

function ledgersBody(fixedPid){
  const o = isOwner(); const U = UI.led = UI.led || {tab:'Rent', prop:'', fy:fy(TODAY)};
  const props = fixedPid ? [prop(fixedPid)] : scopeProps(); const pids = new Set((U.prop && !fixedPid ? [U.prop] : props.map(p => p.id)));

function reconTable(leases, type, from, to){

    const inv = S.invoices.find(i => i.leaseId === L.id && i.type === type && i.period === r.p && i.status !== 'Rejected');
    rows.push({L, r, amt, inv}); }); });
  if(!rows.length) return '';
  rows.sort((a, b) => b.r.p.localeCompare(a.r.p));
  const diffT = rows.reduce((a, x) => a + (x.inv ? x.inv.base - x.amt : 0), 0);
  return `<section class="panel"><header><div><h3>${type} — agreement vs invoices</h3><span class="small muted">Each month’s ${type.toLowerCase()} as per the agreement schedule, checked against what was invoiced and paid, from the first invoice recorded in TruSpace.</span></div>${diffT ? chip('Net difference ' + inr(diffT), 'warn') : chip('Matches agreement', 'ok')}</header><div class="tbl-wrap" style="max-height:60vh;overflow:auto"><table><thead><tr><th>Month</th><th>Premises</th><th class="num">As per agreement</th><th class="num">Invoiced</th><th class="num">Difference</th><th>Due by</th><th>Status</th><th>Paid on</th></tr></thead><tbody>

function P_meter(pid){ const P = prop(pid); return P?.meter ? `· meter <span class="mono">${esc(P.meter)}</span>` : ''; }
function calcBox(c, L){
  return `<div class="calc"><div><span>Amount</span><span class="mono">${inr(c.base)}</span></div>
    <div><span>GST 18%${L?.gstMode === 'RCM' ? ' (paid by TrustLab under RCM, not on invoice)' : ''}</span><span class="mono">${inr(c.gst)}</span></div>
    <div><span>Invoice total</span><span class="mono">${inr(c.total)}</span></div>
    <div><span>Less TDS 10% deducted by TrustLab${c.tds ? '' : ' — not applicable'}</span><span class="mono">−${inr(c.tds)}</span></div>

    ${c.rcm ? `<div class="small muted"><span>TrustLab GST liability under RCM</span><span class="mono">${inr(c.rcm)}</span></div>` : ''}</div>`;

function invDoc(i, P, O, L){

    <div><b>Bill to</b><br>${P && P.managedBy === 'franchise' ? `${esc(tenantOf(P))}<br>${esc(partner(P.partnerId)?.city || '')} · TrustLab franchise partner` : 'TrustLab Diagnostics Private Limited<br>#31, Street No. 5, Prakash Nagar, Begumpet, Hyderabad – 500016<br>CIN U85100TG2020PTC143059'}</div>
    <div><b>Premises</b> ${esc(P?.name || '')} (${esc(P?.code || '')}), ${esc(P?.address || '')}, ${esc(P?.city || '')}${L ? ` · Lease ${esc(L.ref)}` : ''}</div>
    <div style="overflow-x:auto"><table><thead><tr><th>Description</th><th style="text-align:right">Amount</th></tr></thead><tbody>
      <tr><td>${esc(i.desc || `${i.type} for ${perLabel(i.period)}`)}${i.type === 'Rent' ? ' · SAC 997212' : ''}</td><td class="num">${inr(i.base)}</td></tr>
      ${i.gst ? `<tr><td>${P?.state === 'Telangana' && (O?.gstin || '').startsWith('36') ? 'CGST 9% + SGST 9%' : 'IGST 18%'}</td><td class="num">${inr(i.gst)}</td></tr>` : ''}
      <tr class="tot"><td>Invoice total</td><td class="num">${inr(i.total)}</td></tr>
      ${i.tds ? `<tr><td>Less: TDS 10% to be deducted by TrustLab</td><td class="num">−${inr(i.tds)}</td></tr>` : ''}
      <tr class="tot"><td>Net payable</td><td class="num">${inr(i.net)}</td></tr></tbody></table></div>
    ${i.rcm ? `<div style="font-size:12px;color:#555">GST on this supply is payable by the recipient under reverse charge (owner not registered under GST).</div>` : ''}
    <div style="font-size:12px;color:#555">Payment to: ${esc(O?.acctHolder || O?.name || '')} · ${esc([O?.bankName, O?.bankBranch].filter(Boolean).join(', ') || O?.bank || 'bank as per lease')}${O?.acctNo ? ' · A/c ' + esc(maskAcct(O.acctNo)) + ' · IFSC ' + esc(O.ifsc || '') : ''}</div></div>`;

function invoiceHTML(i){
  const P = prop(i.propertyId), O = owner(i.ownerId), L = S.leases.find(l => l.id === i.leaseId);

/* ======================= actions ======================= */
const ACT = {
  go(d){ UI.route = d.r; UI.sel = null; UI.convOpen = false; $('#sheet').innerHTML = ''; closeDrawer(); render(); window.scrollTo(0, 0); },
  tab(d){ UI.tab = d.t; render(); },
  openProp(d){ UI.route = 'property'; UI.sel = d.id; UI.tab = d.tab || 'summary'; closeDrawer(); render(); window.scrollTo(0, 0); },
  close(){ closeDrawer(); },
  scrim(d, el, e){ if(e.target === el) closeDrawer(); },
  zoom(d){ const lb = document.createElement('div'); lb.className = 'lightbox'; lb.innerHTML = d.vid ? `<video src="${esc(d.src)}" controls autoplay playsinline></video><button class="lbx" aria-label="Close">✕</button>` : `<img src="${esc(d.src)}" alt="">`; lb.onclick = e => { if(e.target.tagName !== 'VIDEO') lb.remove(); }; document.body.appendChild(lb); },
  newProperty(){ openDrawer({kind:'property'}); }, editProperty(d){ openDrawer({kind:'property', id:d.id}); },
  newOwner(){ openDrawer({kind:'owner'}); }, editOwner(d){ openDrawer({kind:'owner', id:d.id}); },
  newLease(d){ openDrawer({kind:'lease', prop:d.prop}); }, editLease(d){ openDrawer({kind:'lease', id:d.id}); },
  openLease(d){ openDrawer({kind:'leaseView', id:d.id}); },
  renewLease(d){ const L = S.leases.find(l => l.id === d.id); const start = addDays(L.end, 1); openDrawer({kind:'lease', renewFrom:Object.assign({}, L, {id:undefined, exit:undefined, docs:[], start, end:addMonths(start, 60), rent:Math.round(rentFor(L, L.end.slice(0,7)) * 1.05), status:'Draft', ref:'TDPL-FAC-LSE-' + String(S.leases.length + 1).padStart(3, '0'), depositPaid:true, clauses:(L.clauses || '') + '\nRenewal of ' + L.ref + '.'})}); },
  async activateLease(d){ const L = S.leases.find(l => l.id === d.id); L.status = 'Active'; await save('leases', L); const P = prop(L.propertyId); if(P && P.status === 'Pipeline'){ P.status = 'Under fit-out'; await save('properties', P, true); } if(!inspOf(L.id, 'Move-in')){ toast('Lease active — record the take-over inspection with the owner at possession.'); ACT.newInsp({lease:L.id, kind:'Move-in'}); } },
  newInvoice(d){ openDrawer({kind:'invoice', prop:d.prop, lease:d.lease, period:d.period, type:d.type, mode:d.mode}); },
  openInv(d){ openDrawer({kind:'invoiceView', id:d.id}); },
  async invStep(d){ const i = S.invoices.find(x => x.id === d.id); i.status = d.s; i.log = (i.log || []).concat({at:nowISO(), by:actor(), text: prop(i.propertyId)?.managedBy === 'franchise' ? (d.s === 'Verified' ? 'Verified' : 'Approved for payment') : d.s === 'Verified' ? 'Verified by Accounts Payable' : 'Approved for payment by CMD'}); await save('invoices', i); },
  invReject(d){ const i = S.invoices.find(x => x.id === d.id); const body = $('.dbody'); if($('#rejForm')) return; body.insertAdjacentHTML('beforeend', `<section class="panel" id="rejForm"><div class="body"><form data-form="reject" data-id="${i.id}" style="display:grid;gap:8px"><label for="rj-r" class="eyebrow">Reason the owner will see</label><textarea id="rj-r" name="reason" required placeholder="e.g. Rent amount differs from lease escalation; GSTIN missing"></textarea><div><button class="btn danger">Reject invoice</button></div></form></div></section>`); $('#rj-r').focus(); DRAWER.live = false; },
  dlInvoice(d){ const i = S.invoices.find(x => x.id === d.id); offerDownload(`${i.number.replace(/[^\w-]+/g, '_')}.html`, invoiceHTML(i)); },
  exportCsv(){ const inv = S.invoices.filter(inScope).sort(by('date')); const rows = [['Invoice','Date','Property','Code','Owner','Type','Period','Amount','GST','RCM GST','TDS','Net payable','Status','Paid date','Paid amount','UTR']].concat(inv.map(i => [i.number, i.date, prop(i.propertyId)?.name, prop(i.propertyId)?.code, owner(i.ownerId)?.name, i.type, i.period, i.base, i.gst, i.rcm, i.tds, i.net, invState(i), i.paidDate || '', i.paidAmount || '', i.utr || ''])); offerDownload(`TruSpace-statement-${TODAY}.csv`, rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\n')); },
  newTicket(d){ openDrawer({kind:'ticket', prop:d.prop}); },
  openTicket(d){ openDrawer({kind:'ticketView', id:d.id}); },
  conv(d){ UI.conv = d.id; UI.convOpen = true; render(); },
  convBack(){ UI.convOpen = false; render(); },
  more(){ openSheet(); },
  sheetClose(d, el, e){ if(e.target === el) $('#sheet').innerHTML = ''; },
  schedMode(d){ UI.schedMode = d.m; render(); if(DRAWER) drawDrawer(); },
  ledTab(d){ UI.led = Object.assign(UI.led || {}, {tab:d.t}); render(); },
  ledCsv(d){ const U = UI.led || {tab:'Rent'}; offerDownload(`TruSpace-${U.tab.toLowerCase()}-ledger-${TODAY}.csv`, ledgerCsv(d.pid)); },
  agrJump(d){ const el = document.getElementById('agr-' + d.id); if(el) el.scrollIntoView({behavior:'smooth'}); },
  schedCsv(d){ const L = S.leases.find(l => l.id === d.id); offerDownload(`${L.ref}-rent-schedule.csv`, scheduleCsv(L)); },
  openConv(d){ UI.route = 'messages'; UI.conv = d.id; UI.convOpen = true; closeDrawer(); render(); },
  startExit(d){ const id = d.id || $('#exitPick')?.value; if(!id){ toast('Choose a lease first'); return; } openDrawer({kind:'exitStart', id}); },
  async cancelExit(d){ const L = S.leases.find(l => l.id === d.id); const P = prop(L.propertyId); delete L.exit; await save('leases', L); if(P && P.status === 'Notice served'){ P.status = 'Active'; save('properties', P, true); } },
  viewOwnerProfile(d){ openDrawer({kind:'ownerView', id:d.id}); },
  async verifyBank(d){ const O = owner(d.id); Object.assign(O, {bankVerified:true, bankPending:false, bankVerifiedBy:'TrustLab Accounts', bankVerifiedOn:TODAY}); await save('owners', O); drawDrawer(); },
  previewOwner(d){ UI.roleView = d.id; UI.route = 'o-home'; render(); },
  async delete(d, btn){ if(btn.dataset.armed){ closeDrawer(); await remove(d.col, d.id); } else { btn.dataset.armed = '1'; btn.textContent = 'Click again to delete'; setTimeout(() => { if(btn.isConnected){ delete btn.dataset.armed; btn.textContent = 'Delete'; } }, 4000); } },
  async delPerson(d){ await remove('people', d.id); },
  async copyCode(){ try { await navigator.clipboard.writeText(ME.uid || ''); toast('Copied'); } catch(e){ const r = document.createRange(); r.selectNodeContents($('#mycode')); getSelection().removeAllRanges(); getSelection().addRange(r); toast('Selected — copy it with your keyboard'); } },
  async clearSample(d, btn){ if(!btn.dataset.armed){ btn.dataset.armed = '1'; btn.textContent = 'Click again to remove all sample records'; return; } btn.disabled = true; let n = 0; for(const c of COLS){ for(const r of S[c].filter(x => x.sample)){ await remove(c, r.id); n++; } } toast(n + ' sample records removed'); },
  pickPerson(d){ $('#pp-uid').value = d.uid; $('#pp-label').value = d.name; $('#pp-results').innerHTML = ''; }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if(!t) return;
  const fn = ACT[t.dataset.act]; if(!fn) return;
  if(t.tagName === 'A' || t.tagName === 'TR' || t.classList.contains('cell') || t.dataset.act === 'scrim') { if(t.dataset.act !== 'scrim') e.preventDefault(); }
  if((t.dataset.act === 'scrim' || t.dataset.act === 'sheetClose') && e.target !== t) return;

/* ======================= boot ======================= */
function loadSample(){ const d = sampleData(); COLS.forEach(c => ALL[c] = d[c] || []); rescope(); }
function linkSelf(){ if(!ME.uid) return; const p = ALL.people.find(x => x.uid === ME.uid); ME.linked = p ? {role:p.role, ownerId:p.ownerId} : null; }
loadSample(); doRender();
(async function boot(){
  for(let k = 0; k < 30 && !(window.claude && window.claude.use); k++) await new Promise(r => setTimeout(r, 100));
  if(!window.claude || !window.claude.use) return;
  const [db, assets, user, dl] = await Promise.all(['db','assets','user','downloads'].map(n => window.claude.use(n).catch(() => null)));
  ASSETS = assets; USER = user; DL = dl;
  if(user){ try { ME.uid = await user.id(); ME.canEdit = await user.canEdit(); } catch(e){} }
  if(!db) { render(); return; }
  DB = db; LIVE = true; COLS.forEach(c => ALL[c] = []); rescope();
  let first = 0;
  COLS.forEach(c => DB.collection(c).onSnapshot(snap => {
    ALL[c] = snap.docs.map(d => Object.assign({id:d.id}, d.data()));
    if(c === 'people'){ S.people = ALL.people; linkSelf(); }
    rescope();
    first++; render();
  }, err => { if(err?.code === 'revoked') { LIVE = false; } toast('Live data unavailable: ' + (err?.message || err?.code)); }));
  render();
})();
</script>

  if(q.get('mode')) UI.siteMode = q.get('mode');

})();
